<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#ededed" />
<title>传送到电脑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #3b82f6;
    --primary-dark: #2563eb;
    --bg: #ededed;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --ok: #22c55e;
    --err: #ef4444;
    --border: #e2e8f0;
    --send: #07c160;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;   /* 回退：旧浏览器 */
    height: 100dvh;  /* 动态视口：适配浏览器底部导航栏收起/展开 */
    overflow: hidden;
  }
  header {
    flex-shrink: 0;
    background: var(--bg);
    padding: 14px 16px 10px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header p { margin-top: 3px; font-size: 12px; color: var(--muted); }

  /* 聊天记录区 */
  main {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 12px 8px;
    -webkit-overflow-scrolling: touch;
  }
  main.dragging { background: #e2edfb; }
  .chat-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .msg { display: flex; }
  .msg.out { justify-content: flex-end; }
  .msg.in { justify-content: flex-start; }
  .bubble {
    max-width: 82%; padding: 9px 12px; border-radius: 8px;
    font-size: 15px; line-height: 1.5; word-break: break-all;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .06);
    position: relative;
  }
  .msg.out .bubble { background: #95ec69; color: #0f172a; }
  .msg.in .bubble { background: var(--card); color: var(--text); }
  .msg.out .bubble::after {
    content: ""; position: absolute; right: -6px; top: 10px;
    border: 4px solid transparent; border-left-color: #95ec69; border-right: 0;
  }
  .msg.in .bubble::after {
    content: ""; position: absolute; left: -6px; top: 10px;
    border: 4px solid transparent; border-right-color: var(--card); border-left: 0;
  }
  .msg-meta { font-size: 10px; color: rgba(15, 23, 42, .55); margin-top: 3px; text-align: right; }

  /* 文件气泡 */
  .msg-file .msg-name { font-weight: 600; word-break: break-all; font-size: 14px; }
  .msg-file .msg-size { font-size: 12px; opacity: .7; margin-top: 2px; }
  .msg-file .bar {
    margin-top: 8px; height: 5px; background: rgba(15, 23, 42, .12);
    border-radius: 3px; overflow: hidden;
  }
  .msg-file .bar > div { height: 100%; width: 0; background: var(--primary); border-radius: 3px; transition: width .15s; }
  .msg-file .bar.err > div { background: var(--err); }
  .msg-file .btn.download {
    display: inline-block; margin-top: 8px; padding: 6px 16px; font-size: 13px;
    color: var(--primary-dark); background: rgba(59, 130, 246, .12); border-radius: 6px;
  }
  .msg-file.fail .bubble { cursor: pointer; }
  .msg-file.fail .msg-name::after { content: "（点击重试）"; color: var(--err); font-size: 12px; }

  .chat-empty {
    text-align: center; color: var(--muted); font-size: 13px;
    padding: 60px 24px; line-height: 1.8;
  }

  /* 底部输入栏 */
  .chat-bar {
    flex-shrink: 0;
    display: flex; align-items: flex-end; gap: 8px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: var(--bg);
    border-top: 1px solid var(--border);
    position: relative;
  }
  .plus-btn {
    flex-shrink: 0;
    width: 38px; height: 38px; border: none; border-radius: 50%;
    background: var(--card); color: #475569;
    font-size: 22px; line-height: 1; cursor: pointer;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .12);
    display: flex; align-items: center; justify-content: center;
  }
  .plus-btn.active { background: #dbeafe; color: var(--primary-dark); }
  .chat-bar textarea {
    flex: 1; min-height: 38px; max-height: 110px; resize: none;
    border: none; border-radius: 8px;
    padding: 9px 12px; font-size: 15px; line-height: 1.4;
    font-family: inherit; color: var(--text); background: var(--card);
    outline: none;
  }
  .send-btn {
    flex-shrink: 0;
    padding: 8px 18px; border: none; border-radius: 8px;
    background: var(--send); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .send-btn:disabled { opacity: .5; }

  /* 加号菜单 */
  .more-menu {
    position: absolute; bottom: 58px; left: 8px;
    display: none; flex-direction: column; gap: 2px;
    background: var(--card); border-radius: 10px;
    box-shadow: 0 4px 20px rgba(15, 23, 42, .18);
    padding: 6px; z-index: 10;
  }
  .more-menu.open { display: flex; }
  .more-menu button {
    display: flex; align-items: center; gap: 10px;
    border: none; background: none; cursor: pointer;
    padding: 10px 18px 10px 10px; border-radius: 8px;
    font-size: 14px; color: var(--text); white-space: nowrap;
  }
  .more-menu button:active { background: var(--bg); }
  .more-menu .menu-icon {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .more-menu .menu-icon.file { background: #e0f2fe; color: #0284c7; }
  .more-menu .menu-icon.img { background: #fce7f3; color: #db2777; }
  .menu-mask {
    display: none; position: fixed; inset: 0; z-index: 9;
    background: transparent;
  }
  .menu-mask.show { display: block; }
</style>
</head>
<body>
  <header>
    <h1>传送到电脑</h1>
    <p>文件将保存到电脑上的目标文件夹</p>
  </header>

  <main id="chatScroll">
    <ul id="chatList" class="chat-list">
      <li class="chat-empty" id="chatEmpty">开始和电脑聊天吧<br />点击下方 + 发送文件 / 图片，或直接拖拽</li>
    </ul>
  </main>

  <div class="chat-bar">
    <div class="menu-mask" id="menuMask"></div>
    <button class="plus-btn" id="plusBtn" type="button" aria-label="更多">+</button>
    <textarea id="textInput" maxlength="10000" rows="1" placeholder="输入文字…"></textarea>
    <button class="send-btn" id="textSendBtn" type="button">发送</button>
  </div>

  <div class="more-menu" id="moreMenu">
    <button id="pickFileBtn" type="button">
      <span class="menu-icon file">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </span>
      <span>发送文件</span>
    </button>
    <button id="pickImgBtn" type="button">
      <span class="menu-icon img">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </span>
      <span>发送图片</span>
    </button>
  </div>

  <input type="file" id="fileInput" multiple hidden />
  <input type="file" id="imgInput" accept="image/*" multiple hidden />

<script>
(function () {
  "use strict";
  var CHUNK = 4 * 1024 * 1024;   // 4MB 分片
  var MAX_CONCURRENT = 2;        // 同时上传的文件数
  var MAX_RETRY = 3;

  var chatList = document.getElementById("chatList");
  var chatEmpty = document.getElementById("chatEmpty");
  var chatScroll = document.getElementById("chatScroll");
  var plusBtn = document.getElementById("plusBtn");
  var menuMask = document.getElementById("menuMask");
  var moreMenu = document.getElementById("moreMenu");
  var fileInput = document.getElementById("fileInput");
  var imgInput = document.getElementById("imgInput");
  var textInput = document.getElementById("textInput");
  var textSendBtn = document.getElementById("textSendBtn");

  // 加号菜单展开/收起
  plusBtn.addEventListener("click", function () {
    var open = moreMenu.classList.toggle("open");
    plusBtn.classList.toggle("active", open);
    menuMask.classList.toggle("show", open);
  });
  function closeMenu() {
    moreMenu.classList.remove("open");
    plusBtn.classList.remove("active");
    menuMask.classList.remove("show");
  }
  menuMask.addEventListener("click", closeMenu);
  document.getElementById("pickFileBtn").addEventListener("click", function () { closeMenu(); fileInput.click(); });
  document.getElementById("pickImgBtn").addEventListener("click", function () { closeMenu(); imgInput.click(); });
  fileInput.addEventListener("change", function () { addFiles(fileInput.files); fileInput.value = ""; });
  imgInput.addEventListener("change", function () { addFiles(imgInput.files); imgInput.value = ""; });

  // 拖拽上传
  ["dragenter", "dragover"].forEach(function (ev) {
    chatScroll.addEventListener(ev, function (e) { e.preventDefault(); chatScroll.classList.add("dragging"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    chatScroll.addEventListener(ev, function (e) { e.preventDefault(); chatScroll.classList.remove("dragging"); });
  });
  chatScroll.addEventListener("drop", function (e) { addFiles(e.dataTransfer.files); });

  // ---------- 上传（文件/图片作为聊天消息） ----------
  var jobs = [];
  var active = 0;

  function addFiles(fileList) {
    if (!fileList || !fileList.length) return;
    for (var i = 0; i < fileList.length; i++) {
      var f = fileList[i];
      if (!f.size) continue;
      var job = {
        file: f,
        id: crypto.randomUUID ? crypto.randomUUID() : ("id-" + Date.now() + "-" + i),
        totalChunks: Math.max(1, Math.ceil(f.size / CHUNK)),
        chunk: 0,
        chunkProgress: 0,
        done: false,
        error: null,
        el: buildFileMsg(f)
      };
      job.el.addEventListener("click", function () {
        if (job.error) retryJob(job);
      });
      jobs.push(job);
    }
    pump();
  }

  function buildFileMsg(file) {
    if (chatEmpty) { chatEmpty.remove(); chatEmpty = null; }
    var li = document.createElement("li");
    li.className = "msg out file";
    li.innerHTML =
      '<div class="bubble">' +
        '<div class="msg-name"></div>' +
        '<div class="msg-size"></div>' +
        '<div class="bar"><div></div></div>' +
        '<div class="msg-meta">上传中 0%</div>' +
      '</div>';
    li.querySelector(".msg-name").textContent = file.name;
    li.querySelector(".msg-size").textContent = formatSize(file.size);
    chatList.appendChild(li);
    scrollBottom();
    return li;
  }

  function pump() {
    while (active < MAX_CONCURRENT && jobs.length) {
      var job = jobs.shift();
      active++;
      uploadJob(job)["catch"](function (e) { failJob(job, e); })["finally"](function () {
        active--;
        pump();
      });
    }
  }

  function uploadJob(job) {
    return (async function () {
      while (job.chunk < job.totalChunks) {
        var start = job.chunk * CHUNK;
        var blob = job.file.slice(start, start + CHUNK);
        var sent = false;
        for (var attempt = 0; attempt < MAX_RETRY && !sent; attempt++) {
          try {
            await sendChunk(job, blob);
            sent = true;
          } catch (e) {
            if (attempt === MAX_RETRY - 1) throw e;
            await sleep(800 * (attempt + 1));
          }
        }
        job.chunk++;
        job.chunkProgress = 0;
        updateProgress(job);
      }
      job.done = true;
      var bar = job.el.querySelector(".bar");
      bar.style.display = "none";
      var meta = job.el.querySelector(".msg-meta");
      meta.textContent = "已发送 ✓ " + clock(Date.now());
      scrollBottom();
    })();
  }

  function sendChunk(job, blob) {
    return new Promise(function (resolve, reject) {
      var fd = new FormData();
      fd.append("filename", job.file.name);
      fd.append("fileId", job.id);
      fd.append("index", String(job.chunk));
      fd.append("total", String(job.totalChunks));
      fd.append("file", blob, job.file.name);

      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/upload");
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
          job.chunkProgress = e.loaded / e.total;
          updateProgress(job);
        }
      };
      xhr.onload = function () {
        if (xhr.status !== 200) return reject(new Error("服务器返回错误 " + xhr.status));
        try {
          var res = JSON.parse(xhr.responseText);
          if (!res.ok) return reject(new Error(res.error || "上传失败"));
          resolve(res);
        } catch (e) { reject(new Error("响应解析失败")); }
      };
      xhr.onerror = function () { reject(new Error("网络错误")); };
      xhr.send(fd);
    });
  }

  function updateProgress(job) {
    var p = (job.chunk + job.chunkProgress) / job.totalChunks;
    if (p > 1) p = 1;
    var pct = Math.round(p * 100);
    job.el.querySelector(".bar > div").style.width = pct + "%";
    job.el.querySelector(".msg-meta").textContent = "上传中 " + pct + "%";
  }

  function failJob(job, e) {
    job.error = e;
    job.el.classList.add("fail");
    job.el.querySelector(".bar").classList.add("err");
    job.el.querySelector(".msg-meta").textContent = "发送失败";
    scrollBottom();
  }

  function retryJob(job) {
    job.error = null;
    job.chunk = 0;
    job.chunkProgress = 0;
    job.el.classList.remove("fail");
    var bar = job.el.querySelector(".bar");
    bar.classList.remove("err");
    bar.style.display = "";
    bar.firstElementChild.style.width = "0%";
    job.el.querySelector(".msg-meta").textContent = "上传中 0%";
    jobs.push(job);
    pump();
  }

  // ---------- 发送文本 ----------
  textSendBtn.addEventListener("click", sendText);

  function sendText() {
    var text = textInput.value.trim();
    if (!text) return;
    textSendBtn.disabled = true;
    textSendBtn.textContent = "发送中…";
    fetch("/api/text", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok) {
          textInput.value = "";
          addChatMsg("out", "text", { text: text, time: Date.now() });
        } else {
          alert("发送失败：" + (res.error || "未知错误"));
        }
      })
      .catch(function () { alert("发送失败：网络错误"); })
      .finally(function () {
        textSendBtn.disabled = false;
        textSendBtn.textContent = "发送";
      });
  }

  // ---------- 接收电脑发送的内容（SSE） ----------
  var chatSeen = new Set();

  function addChatMsg(dir, kind, item) {
    if (chatEmpty) { chatEmpty.remove(); chatEmpty = null; }
    var li = document.createElement("li");
    li.className = "msg " + dir + (kind === "file" ? " file" : "");
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (kind === "file") {
      var name = document.createElement("div");
      name.className = "msg-name";
      name.textContent = item.name;
      var size = document.createElement("div");
      size.className = "msg-size";
      size.textContent = formatSize(item.size || 0);
      bubble.appendChild(name);
      bubble.appendChild(size);
      if (dir === "in") {
        var a = document.createElement("a");
        a.className = "btn download";
        a.textContent = "下载";
        a.href = "/api/download/" + encodeURIComponent(item.id);
        a.download = item.name || "file";
        bubble.appendChild(a);
      }
    } else {
      var text = document.createElement("div");
      text.textContent = item.text || "";
      bubble.appendChild(text);
    }
    var meta = document.createElement("div");
    meta.className = "msg-meta";
    meta.textContent = clock(item.time || Date.now());
    bubble.appendChild(meta);
    li.appendChild(bubble);
    chatList.appendChild(li);
    scrollBottom();
    while (chatList.children.length > 200) chatList.firstChild.remove();
  }

  if (window.EventSource) {
    var es = new EventSource("/api/events");
    es.addEventListener("outbox", function (e) {
      try {
        var item = JSON.parse(e.data);
        if (chatSeen.has(item.id)) return;
        chatSeen.add(item.id);
        addChatMsg("in", item.kind === "file" ? "file" : "text", item);
      } catch (err) { /* 忽略异常消息 */ }
    });
  }

  function scrollBottom() {
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
  }

  function clock(ms) {
    var d = new Date(ms);
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
})();
</script>
</body>
</html>
