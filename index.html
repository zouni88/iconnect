<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iconnect · 局域网文件传输</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1>iconnect</h1>
            <p>局域网文件传输</p>
          </div>
        </div>
        <div id="statusPill" class="pill off">
          <span class="dot"></span>
          <span id="statusText">未启动</span>
        </div>
      </header>

      <main>
        <aside class="side">
          <section class="card qr-card">
            <div class="qr-wrap">
              <div id="qrPlaceholder" class="qr-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7"/>
                  <rect x="14" y="3" width="7" height="7"/>
                  <rect x="3" y="14" width="7" height="7"/>
                  <path d="M14 14h3v3h-3z"/>
                  <path d="M20 20h1M17 20h1M20 17h1"/>
                </svg>
                <p>启动服务后显示二维码</p>
              </div>
              <div id="qrBox" class="qr-box" style="display: none"></div>
            </div>
            <div id="urlRow" class="url-row" style="display: none">
              <span id="urlText" class="url"></span>
              <button id="copyBtn" class="btn small">复制</button>
            </div>
            <p class="hint">手机连接同一 WiFi，扫码后即可在浏览器中收发文件与文本</p>
          </section>

          <section class="card control-card">
            <div class="field">
              <label for="dirInput">保存到</label>
              <div class="dir-row">
                <input id="dirInput" type="text" readonly spellcheck="false" />
                <button id="chooseDirBtn" class="btn">选择文件夹</button>
              </div>
            </div>

            <div class="actions">
              <button id="startBtn" class="btn primary">启动服务</button>
              <button id="stopBtn" class="btn danger" disabled>停止服务</button>
              <button id="openDirBtn" class="btn" disabled>打开文件夹</button>
            </div>

            <div class="history">
              <div class="history-head">
                <h2>从手机收到的文件</h2>
                <span id="historyCount" class="count">0 个</span>
              </div>
              <ul id="historyList" class="history-list">
                <li class="empty">暂无记录</li>
              </ul>
            </div>
          </section>
        </aside>

        <section class="card chat-card">
          <div class="chat-head">
            <h2>电脑 ↔ 手机</h2>
            <span id="chatStatus" class="chat-status">服务未启动</span>
          </div>
          <ul id="chatList" class="chat-list">
            <li class="empty">暂无消息</li>
          </ul>
          <div class="chat-bar">
            <div class="menu-mask" id="menuMask"></div>
            <button id="plusBtn" class="plus-btn" type="button" aria-label="更多">+</button>
            <input id="sendTextInput" type="text" maxlength="10000" placeholder="输入文本，回车发送" />
            <button id="sendTextBtn" class="send-btn" type="button">发送</button>
          </div>
          <div class="more-menu" id="moreMenu">
            <button id="pickFileBtn" type="button">
              <span class="menu-icon file">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                </svg>
              </span>
              <span>发送文件</span>
            </button>
            <button id="pickImgBtn" type="button">
              <span class="menu-icon img">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
              </span>
              <span>发送图片</span>
            </button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
